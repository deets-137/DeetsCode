<!DOCTYPE html>
<html lang="en" data-theme="1">
<head>
  <meta charset="UTF-8" />
  <title>Harness</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Bottom-right stack -->
  <div class="br-stack">
    <div class="br-left">
      <div class="auto-apply-panel">
        <div class="toggle-wrapper">
          <input type="checkbox" id="auto-apply-toggle">
          <label for="auto-apply-toggle" class="toggle-slider"></label>
        </div>
        <span class="auto-apply-label">auto apply</span>
      </div>
      <div class="model-picker-panel">
        <select id="model-select" class="model-select">
          <option value="" disabled selected>loading...</option>
        </select>
      </div>
    </div>
    <div class="br-right">
      <div class="ctx-panel">
        <div class="ctx-label">context <span id="ctx-pct">0%</span></div>
      <div class="ctx-bar-track"><div class="ctx-bar-fill" id="ctx-bar"></div></div>
      <div class="ctx-tokens" id="ctx-tokens">0 / 131072</div>
    </div>
    <div class="theme-picker" id="theme-picker">
      <!-- dynamically populated by fetchThemes() -->
    </div>
    </div>
  </div>

  <div class="canvas">

    <!-- Left 30%: chat panel -->
    <div class="left-panel">

      <!-- Directory picker -->
      <div class="chat-input-panel" style="display:flex;gap:6px;padding:8px 10px;">
        <input id="dir-input" type="text" placeholder="Project path..." style="
          flex:1; background:var(--textbox-bg); border:none; border-radius:6px;
          padding:6px 10px; font-family:monospace; font-size:12px; color:#2a2a2a; outline:none;
        "/>
        <button onclick="setDir()" style="
          background:var(--textbox-bg); border:none; border-radius:6px;
          padding:6px 10px; font-family:monospace; font-size:12px; cursor:pointer; color:#2a2a2a;
        ">set</button>
      </div>

      <!-- Chat input -->
      <div class="chat-input-panel">
        <textarea id="chat-textbox" class="chat-textbox" placeholder="Message Gemma... (Enter to send, Shift+Enter for newline)"></textarea>
        <div class="chat-actions">
          <button id="stop-btn" class="chat-action-btn" onclick="cancelRun()" disabled>stop</button>
          <button class="chat-action-btn" onclick="compactConversation()" title="Summarize and trim the conversation">compact</button>
          <button class="chat-action-btn" onclick="resetConversation()">reset</button>
        </div>
      </div>

      <!-- Response -->
      <div class="response-panel">
        <div class="response-box">
          <div class="response-text" id="response-text"></div>
        </div>
      </div>

    </div>

    <!-- Middle column: Tools + Config stacked -->
    <div class="middle-column">
      <!-- Tool activity panel -->
      <div class="tool-panel" id="tool-panel">
        <div class="file-panel-header">
          <span>tools</span>
          <button onclick="clearToolPanel()">✕</button>
        </div>
        <div class="tool-panel-inner" id="tool-panel-inner"></div>
      </div>

      <!-- Config row: file click action + temperature slider -->
      <div class="config-row">
        <div class="tool-panel config-panel" id="config-panel">
          <div class="file-panel-header">
            <span>file click action</span>
          </div>
          <div class="config-panel-inner">
            <textarea id="file-click-template" class="config-textarea" placeholder="Template for clicking a file. Use {path} for the file path."></textarea>
          </div>
        </div>
        <div class="temp-slider-panel">
          <div class="temp-label">temp</div>
          <div class="temp-track">
            <input type="range" id="temp-slider" class="temp-range" min="0" max="100" value="30" orient="vertical">
          </div>
          <div class="temp-value" id="temp-value">0.3</div>
        </div>
      </div>
    </div>

    <!-- Context files panel -->
    <div class="file-panel" id="context-panel">
      <div class="file-panel-header">
        <span>in context</span>
        <button onclick="clearContextFiles()">✕</button>
      </div>
      <div class="file-panel-inner" id="context-files"></div>
    </div>

    <!-- Right column: files + packs stacked -->
    <div class="right-column">
      <div class="file-panel">
        <div class="file-panel-header">
          <span>files</span>
          <button onclick="refreshTree()">↺</button>
        </div>
        <div class="file-panel-inner" id="file-tree"></div>
      </div>

      <div class="file-panel packs-panel-side">
        <div class="file-panel-header">
          <span>knowledge packs</span>
          <button onclick="refreshPacks()" title="Rescan packs">↺</button>
        </div>
        <div class="file-panel-inner packs-inner">
          <div class="packs-chips" id="packs-chips">
            <span class="packs-empty">no packs found</span>
          </div>
        </div>
      </div>

      <div class="file-panel task-panel" id="task-panel">
        <div class="file-panel-header">
          <span>task list</span>
          <button onclick="refreshTaskPanel()" title="Refresh task list">↺</button>
        </div>
        <div class="file-panel-inner task-inner" id="task-inner">
          <span class="task-empty">no task.md found</span>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
