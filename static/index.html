<!DOCTYPE html>
<html lang="en" data-theme="1">
<head>
  <meta charset="UTF-8" />
  <title>Harness</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Region grid is built client-side from /api/layout by panel-shell.js.
       Until it runs, the staging div below is invisible (display:none on
       <template>-style host). Sections inside it have ids referenced by
       panel_layout.json and get hoisted into their assigned region. -->
  <div class="canvas" id="region-grid"></div>

  <div id="legacy-staging" hidden>

    <!-- [legacy-chat] Whole left-column cluster: dir picker + chat input + response. -->
    <div id="legacy-chat" class="left-panel">

      <!-- Directory picker -->
      <div class="chat-input-panel" style="display:flex;gap:6px;padding:8px 10px;">
        <input id="dir-input" type="text" placeholder="Project path..." style="
          flex:1; background:var(--textbox-bg); border:none; border-radius:6px;
          padding:6px 10px; font-family:monospace; font-size:12px; color:var(--textbox-text); outline:none;
        "/>
        <button onclick="setDir()" style="
          background:var(--textbox-bg); border:none; border-radius:6px;
          padding:6px 10px; font-family:monospace; font-size:12px; cursor:pointer; color:var(--textbox-text);
        ">set</button>
      </div>

      <!-- Chat input -->
      <div class="chat-input-panel">
        <textarea id="chat-textbox" class="chat-textbox" placeholder="Message... (Enter to send, Shift+Enter for newline)"></textarea>
        <div class="chat-actions">
          <button id="stop-btn" class="chat-action-btn" onclick="cancelRun()" disabled>stop</button>
          <button class="chat-action-btn" onclick="compactConversation()" title="Summarize and trim the conversation">compact</button>
          <button class="chat-action-btn" onclick="resetConversation()">reset</button>
        </div>
      </div>

      <!-- Response -->
      <div class="response-panel">
        <div class="response-box">
          <div class="response-text" id="response-text"></div>
        </div>
      </div>

    </div>

    <!-- [middle column staging] Activity, settings, reference — each becomes
         its own instance in panel_layout.json. Wrapper here is just so the
         children sit side-by-side in the staging div (gets stripped). -->
    <div>
      <!-- activity-panel removed — tool_log and pending_writes are now real
           panels in layout/panel_layout.json (phase 5). -->
      <div id="activity-panel" hidden></div>

      <!-- legacy-settings removed — now the `settings` panel (phase 4.5). -->
      <div id="legacy-settings" hidden></div>

      <!-- info-panel and status-panel removed — knowledge_packs, slash_commands,
           in_context_files, and task_list are now real panels declared in
           layout/panel_layout.json (phase 4). -->
    </div>

    <!-- [right column staging] Files + bot-ops + blog-ops. Region wrapper
         gets right-column class via panel-shell.js. -->
    <div>
      <!-- legacy-files removed — now the `files` panel (phase 4.5). -->
      <div id="legacy-files" hidden></div>

      <!-- legacy bot-ops + blog-ops removed — now bot_ops and blog_ops panels (phase 6). -->
      <div id="blog-ops" hidden></div>
      <div id="bot-ops" hidden></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <!-- panel-shell.js MUST run before app.js — it hoists sections from
       #legacy-staging into the region grid so app.js's getElementById calls
       find them in their final positions. -->
  <script src="panel-shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
