<div data-panel-actions>
  <form class="yt-form" style="display:flex;gap:4px;align-items:center;">
    <input class="yt-input" type="text" placeholder="paste youtube url or id"
           style="width:200px;font-size:11px;padding:3px 6px;background:var(--textbox-bg,#222);
                  color:var(--textbox-text,#eee);border:1px solid var(--glass-border,#444);
                  border-radius:3px;">
    <button type="submit" title="Load" style="font-size:11px;">load</button>
  </form>
</div>

<div class="yt-wrap" style="display:flex;flex-direction:column;height:100%;min-height:180px;">
  <div class="yt-empty" style="opacity:.55;font-size:11px;font-family:monospace;
                                padding:8px;text-align:center;">
    paste a youtube url, video id, or share link → load
  </div>
  <div class="yt-frame-wrap" style="display:none;flex:1;position:relative;">
    <div class="yt-player-slot"></div>
  </div>
</div>

<script>
(function () {
  // Resolve which instance this script belongs to. document.currentScript
  // points at the <script> tag; walking up to .panel-instance gives us the
  // unique id even if multiple youtube panels exist on the page.
  const scriptEl = document.currentScript;
  const root = scriptEl ? scriptEl.closest(".panel-instance") : null;
  if (!root) return;
  const instance = root.dataset.instance || "youtube";
  const KEY = "harness.youtube." + instance + ".video";

  const form  = root.querySelector(".yt-form");
  const input = root.querySelector(".yt-input");
  const empty = root.querySelector(".yt-empty");
  const frameWrap = root.querySelector(".yt-frame-wrap");
  const slot = root.querySelector(".yt-player-slot");
  if (!form || !slot) return;

  // The shell caps .panel-content at manifest preferred.height so idle
  // panels don't sprawl. For the playing video we want the iframe to fill
  // whatever cell our setSpan claimed — toggle the cap accordingly.
  const contentEl = root.querySelector(".panel-content");
  function setContentUncapped(uncapped) {
    if (!contentEl) return;
    contentEl.style.maxHeight = uncapped ? "none" : "";
  }

  // ── YT IFrame API loader — shared across all youtube instances ──────────
  // A bare /embed/ iframe exposes no playback events; the IFrame API does.
  // Load the API script once per page; every panel instance awaits the same
  // promise. `host: youtube-nocookie.com` keeps the privacy-enhanced embed.
  function ytApi() {
    if (window._ytApiPromise) return window._ytApiPromise;
    window._ytApiPromise = new Promise((resolve, reject) => {
      if (window.YT && window.YT.Player) { resolve(window.YT); return; }
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => {
        if (prev) { try { prev(); } catch (e) {} }
        resolve(window.YT);
      };
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      s.onerror = () => reject(new Error("yt iframe api failed to load"));
      document.head.appendChild(s);
    });
    return window._ytApiPromise;
  }

  // Accepts: bare ID, watch?v=, youtu.be/, /embed/, /shorts/, /live/.
  // Returns {id, shorts} — shorts flag drives the panel's aspect choice.
  function extractId(s) {
    s = (s || "").trim();
    if (!s) return { id: "", shorts: false };
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return { id: s, shorts: false };
    let m;
    m = s.match(/[?&]v=([A-Za-z0-9_-]{11})/); if (m) return { id: m[1], shorts: false };
    m = s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/); if (m) return { id: m[1], shorts: false };
    m = s.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/);
    if (m) return { id: m[1], shorts: true };
    m = s.match(/youtube\.com\/(?:embed|live|v)\/([A-Za-z0-9_-]{11})/);
    if (m) return { id: m[1], shorts: false };
    return { id: "", shorts: false };
  }

  // Convert a target aspect ratio (w/h) into a bento span. Picks a width
  // bucket — hero (12) for landscape, narrow (3) for vertical — then
  // chooses rows so the resulting pixel cell approximates the aspect.
  // Falls back to (12, 2) before the bento mounts.
  function spanForAspect(aspect) {
    const cfg = (window.harness && harness.gridConfig) ? harness.gridConfig() : null;
    if (!cfg || !cfg.colPx) return aspect >= 1 ? { cols: 12, rows: 3 } : { cols: 3, rows: 4 };
    const targetCols = aspect >= 1 ? 12 : Math.min(4, cfg.cols);
    const widthPx = targetCols * cfg.colPx + Math.max(0, targetCols - 1) * cfg.gapPx;
    const wantedHeight = widthPx / aspect;
    // height = rows*rowPx + (rows-1)*gapPx → rows = (wantedHeight + gap) / (rowPx + gap)
    const rowUnit = cfg.rowPx + cfg.gapPx;
    let rows = Math.round((wantedHeight + cfg.gapPx) / rowUnit);
    rows = Math.max(2, Math.min(6, rows));
    return { cols: targetCols, rows };
  }

  let player = null;
  let currentAspect = 16 / 9;

  function setTileState(state) {
    if (window.harness && harness.setState) harness.setState(instance, state);
  }

  // Playback → tileflow. This is the "media bubbles when playing" hook:
  // the *player* drives the panel state, not the load button, so a video
  // the user pauses tucks back down and a restored-but-unplayed video
  // never hijacks the hero slot on boot.
  function onPlayerStateChange(e) {
    const YT = window.YT;
    if (!YT || !YT.PlayerState) return;
    if (e.data === YT.PlayerState.PLAYING) {
      setContentUncapped(true);
      if (window.harness && harness.setSpan) harness.setSpan(instance, spanForAspect(currentAspect));
      if (window.harness && harness.logInteraction) {
        harness.logInteraction(instance, "custom", { act: "yt-play" });
      }
      setTileState("focused");
    } else if (e.data === YT.PlayerState.PAUSED) {
      setTileState("active");
    } else if (e.data === YT.PlayerState.ENDED) {
      setTileState("idle");
    }
  }

  function styleIframe() {
    const iframe = player && player.getIframe ? player.getIframe() : null;
    if (!iframe) return;
    iframe.style.cssText =
      "position:absolute;inset:0;width:100%;height:100%;border:0;" +
      "border-radius:3px;background:#000;";
  }

  // Fallback when the IFrame API can't load (offline / blocked): plain
  // embed, no playback events — behaves like the pre-API panel.
  function bareEmbed(id) {
    slot.outerHTML = '<iframe class="yt-player-slot" ' +
      'src="https://www.youtube-nocookie.com/embed/' + id + '?rel=0" ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
      'allowfullscreen referrerpolicy="strict-origin-when-cross-origin" ' +
      'style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:3px;background:#000;"></iframe>';
  }

  // `restore: true` = re-hydrating from localStorage on boot. Cue the video
  // (thumbnail, no autoplay) and leave tileflow state alone.
  function load(idOrUrl, restore) {
    const { id, shorts } = extractId(idOrUrl);
    if (!id) {
      empty.textContent = "couldn't find a video id in: " + idOrUrl;
      empty.style.display = "";
      frameWrap.style.display = "none";
      setContentUncapped(false);
      if (window.harness && harness.setSpan) harness.setSpan(instance, null);
      setTileState("idle");
      return;
    }
    currentAspect = shorts ? 9 / 16 : 16 / 9;
    empty.style.display = "none";
    frameWrap.style.display = "";
    input.value = id;
    try { localStorage.setItem(KEY, id); } catch (e) {}

    ytApi().then((YT) => {
      if (!root.isConnected) return; // panel re-rendered while API loaded
      if (player) {
        if (restore) player.cueVideoById(id);
        else player.loadVideoById(id);
        return;
      }
      player = new YT.Player(slot, {
        videoId: id,
        host: "https://www.youtube-nocookie.com",
        playerVars: { rel: 0, autoplay: restore ? 0 : 1 },
        events: {
          onReady: styleIframe,
          onStateChange: onPlayerStateChange,
        },
      });
    }).catch(() => bareEmbed(id));
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    load(input.value, false);
  });

  let saved = "";
  try { saved = localStorage.getItem(KEY) || ""; } catch (e) {}
  if (saved) load(saved, true);
})();
</script>
