# EXAMPLE llama-server preset file (replaced Modelfile.qwen3.example when the
# harness moved from Ollama to llama.cpp, Aug 2026).
#
# The harness does not read this file — llama-server does, via
# `--models-preset llama-server.ini` (add that to LLAMA_SERVER_ARGS in
# config.py, or your own launch command). Each [section] registers a model
# with per-model overrides; anything not set here inherits the global flags
# llama-server was launched with (e.g. -ngl 99). Section names become the
# model ids the harness's picker shows.
#
# GGUF chat templates are embedded in the file, so no TEMPLATE/stop-token
# block is needed — that's the part of the old Modelfile that simply died.

[qwen3]
model = C:\path\to\your\models\qwen3-8b-q4_k_m.gguf
ctx-size = 32768
# Sampler settings Qwen3 was trained for (carried over from the old Modelfile):
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0
